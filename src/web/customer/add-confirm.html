<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>顧客情報確認</title>

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>

<body>
<div class="container mt-5">

    <h2 class="mb-4">入力内容の確認</h2>

    <table class="table table-bordered">
        <tr>
            <th>会社名</th>
            <td id="companyName"></td>
        </tr>
        <tr>
            <th>業種</th>
            <td id="industry"></td>
        </tr>
        <tr>
            <th>連絡先</th>
            <td id="contact"></td>
        </tr>
        <tr>
            <th>所在地</th>
            <td id="location"></td>
        </tr>
    </table>

    <button id="submitBtn" class="btn btn-primary">登録する</button>
    <a href="./add.html" class="btn btn-secondary">戻る</a>

</div>

<script type="module">
import config from '../config.js';

const params = new URLSearchParams(window.location.search);

const data = {
    companyName: params.get("companyName"),
    industry: params.get("industry"),
    contact: params.get("contact"),
    location: params.get("location")
};

// 画面表示
document.getElementById("companyName").textContent = data.companyName;
document.getElementById("industry").textContent = data.industry;
document.getElementById("contact").textContent = data.contact;
document.getElementById("location").textContent = data.location;

// 登録処理
document.getElementById("submitBtn").addEventListener("click", async () => {
    const res = await fetch(config.apiUrl + "/add-customer", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: new URLSearchParams(data)
    });

    const result = await res.json();

    if (result.success) {
        alert("登録成功");
        window.location.href = "./list.html";
    } else {
        alert("登録失敗");
    }
});
</script>

</body>
</html>
