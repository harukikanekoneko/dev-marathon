<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>顧客詳細</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>

<body class="container mt-5">

<h2>顧客詳細</h2>

<table class="table table-bordered">
  <tr><th>ID</th><td id="id"></td></tr>
  <tr><th>会社名</th><td id="company_name"></td></tr>
  <tr><th>業種</th><td id="industry"></td></tr>
  <tr><th>連絡先</th><td id="contact"></td></tr>
  <tr><th>所在地</th><td id="location"></td></tr>
</table>

<a href="./list.html" class="btn btn-secondary">戻る</a>

<script type="module">
import config from "../config.js";

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

fetch(`${config.apiUrl}/customers/${id}`)
  .then(res => res.json())
  .then(c => {
    document.getElementById("id").textContent = c.id;
    document.getElementById("company_name").textContent = c.company_name;
    document.getElementById("industry").textContent = c.industry;
    document.getElementById("contact").textContent = c.contact;
    document.getElementById("location").textContent = c.location;
  });
</script>

</body>
</html>
