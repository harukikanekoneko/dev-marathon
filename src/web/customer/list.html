<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>一覧</title>
</head>

<body>

<h2>顧客一覧</h2>

<table border="1">
  <thead>
    <tr>
      <th>ID</th>
      <th>会社名</th>
      <th>連絡先</th>
    </tr>
  </thead>

  <tbody id="customer-list"></tbody>
</table>

<script type="module">
import config from "../config.js";

window.addEventListener("DOMContentLoaded", () => {

  const tbody = document.getElementById("customer-list");

  fetch(config.apiUrl + "/customers")
    .then(res => res.json())
    .then(data => {

      data.forEach(c => {

        const row = tbody.insertRow();

        row.insertCell(0).textContent = c.customer_id;

        row.insertCell(1).innerHTML =
          `<a href="./detail.html?id=${c.customer_id}">
            ${c.company_name}
          </a>`;

        row.insertCell(2).textContent = c.contact;
      });

    })
    .catch(err => console.error(err));
});
</script>

</body>
</html>
